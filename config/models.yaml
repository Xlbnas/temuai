# TEMU Image Factory - 模型配置
# 价格与能力可随时修改，禁止在 Python 源码中硬编码。
#
# 当前生产模型：
#   - nano_banana_lite  (gemini-3.1-flash-lite-image, 低成本草稿, 仅 1K)
#   - gpt-image-2-vip   (API易 OpenAI 兼容端点, 30 档固定尺寸)
#   - Nano Banana 2     (gemini-3.1-flash-image, GA 正式版, 主力生产)
#   - gpt-image-2       (API易 OpenAI 兼容端点, mask inpaint / 兜底)
#
# 注意:
#   - gemini-3.1-flash-lite-image 是 Nano Banana 2 Lite 图片模型，
#     不要与 gemini-3.1-flash-lite（文本/多模态理解模型）混淆。
#   - gemini-3.1-flash-image-preview 已于 2026-06-25 停服, GA ID 为 gemini-3.1-flash-image。

models:
  nano_banana_lite:
    provider: apiyi_gemini
    model: gemini-3.1-flash-lite-image
    capabilities:
      text_to_image: true
      image_edit: true
      multi_image: true
    supported_resolutions:
      - "1K"
    default_image_size: 1K
    default_aspect_ratio: "3:4"
    timeout: 180
    estimated_cost_mode: request
    estimated_cost_usd: 0.034
    pricing_version: repository-estimate-2026-07
    pricing_status: unknown
    pricing_source: existing_repository_estimate_not_provider_verified
    role: draft

  nano_banana_2:
    provider: apiyi_gemini
    model: gemini-3.1-flash-image
    capabilities:
      text_to_image: true
      image_edit: true
      multi_image: true
    default_image_size: 2K
    candidate_image_size: 1K
    default_aspect_ratio: "3:4"
    timeout: 360
    estimated_cost_mode: request
    estimated_cost_usd: 0.055
    pricing_version: repository-estimate-2026-07
    pricing_status: unknown
    pricing_source: existing_repository_estimate_not_provider_verified
    role: production

  gpt_image_2_vip:
    provider: apiyi_openai
    model: gpt-image-2-vip
    capabilities:
      text_to_image: true
      image_edit: true
      multi_image: true
      exact_size: true
      mask: false
    # API易明确：gpt-image-2-vip 不支持 n 参数（单次仅返回 1 张），
    # 多张由 Provider 层循环独立调用实现，n 永远不进入请求 Body。
    supports_n: false
    default_aspect_ratio: "3:4"
    default_resolution: "2K"
    # API易官方 30 档尺寸表（10 比例 x 1K/2K/4K），统一定价
    size_map:
      "1:1":  { "1K": "1280x1280", "2K": "2048x2048", "4K": "2880x2880" }
      "2:3":  { "1K": "848x1280",  "2K": "1360x2048", "4K": "2336x3520" }
      "3:2":  { "1K": "1280x848",  "2K": "2048x1360", "4K": "3520x2336" }
      "3:4":  { "1K": "960x1280",  "2K": "1536x2048", "4K": "2480x3312" }
      "4:3":  { "1K": "1280x960",  "2K": "2048x1536", "4K": "3312x2480" }
      "4:5":  { "1K": "1024x1280", "2K": "1632x2048", "4K": "2560x3216" }
      "5:4":  { "1K": "1280x1024", "2K": "2048x1632", "4K": "3216x2560" }
      "9:16": { "1K": "720x1280",  "2K": "1152x2048", "4K": "2160x3840" }
      "16:9": { "1K": "1280x720",  "2K": "2048x1152", "4K": "3840x2160" }
      "21:9": { "1K": "1280x544",  "2K": "2048x864",  "4K": "3840x1632" }
    supported_sizes:
      - "1280x1280"
      - "848x1280"
      - "1280x848"
      - "960x1280"
      - "1280x960"
      - "1024x1280"
      - "1280x1024"
      - "720x1280"
      - "1280x720"
      - "1280x544"
      - "2048x2048"
      - "1360x2048"
      - "2048x1360"
      - "1536x2048"
      - "2048x1536"
      - "1632x2048"
      - "2048x1632"
      - "1152x2048"
      - "2048x1152"
      - "2048x864"
      - "2880x2880"
      - "2336x3520"
      - "3520x2336"
      - "2480x3312"
      - "3312x2480"
      - "2560x3216"
      - "3216x2560"
      - "2160x3840"
      - "3840x2160"
      - "3840x1632"
    timeout: 300
    estimated_cost_mode: request
    estimated_cost_usd: 0.03
    pricing_version: repository-estimate-2026-07
    pricing_status: unknown
    pricing_source: existing_repository_estimate_not_provider_verified
    role: draft

  gpt_image_2:
    provider: apiyi_openai
    model: gpt-image-2
    capabilities:
      text_to_image: true
      image_edit: true
      multi_image: true
      exact_size: true
      mask: true
    supported_sizes:
      - "1024x1024"
      - "1024x1536"
      - "1536x1024"
    default_size: "1024x1536"
    timeout: 360
