# TEMU Image Factory - 模型配置
# 价格与能力可随时修改，禁止在 Python 源码中硬编码。
#
# 当前生产模型：
#   - nano_banana_lite  (gemini-3.1-flash-lite-image, 低成本草稿, 仅 1K)
#   - gpt-image-2-vip   (API易 OpenAI 兼容端点, 30 档固定尺寸)
#   - Nano Banana 2     (gemini-3.1-flash-image, GA 正式版, 主力生产)
#   - gpt-image-2       (API易 OpenAI 兼容端点, mask inpaint / 兜底)
#
# 注意:
#   - gemini-3.1-flash-lite-image 是 Nano Banana 2 Lite 图片模型，
#     不要与 gemini-3.1-flash-lite（文本/多模态理解模型）混淆。
#   - Nano Banana 2 的 GA 正式模型名为 gemini-3.1-flash-image；APIYI 官方
#     2026-05-29 公告：旧 -preview 名仍可用且价格不变（见 M2C 定价证据文档）。

models:
  nano_banana_lite:
    provider: apiyi_gemini
    model: gemini-3.1-flash-lite-image
    capabilities:
      text_to_image: true
      image_edit: true
      multi_image: true
    supported_resolutions:
      - "1K"
    default_image_size: 1K
    default_aspect_ratio: "3:4"
